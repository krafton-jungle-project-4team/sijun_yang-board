name: namanmu

services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-nmm_starter}
            POSTGRES_USER: ${POSTGRES_USER:-nmm}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nmm_password}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./apps/api-server/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
            - ./apps/api-server/database/dummy-data.sql:/docker-entrypoint-initdb.d/002-dummy-data.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    api-server:
        build:
            context: .
            dockerfile: apps/api-server/Dockerfile
            target: development
        env_file:
            - apps/api-server/.env
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - "${PORT:-4000}:${PORT:-4000}"
        volumes:
            - .:/workspace
            - api-node-modules:/workspace/node_modules
        command: npm run dev:docker --workspace @nmm/api-server

volumes:
    postgres-data:
    api-node-modules:
